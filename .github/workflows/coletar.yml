name: Coletar e publicar

on:
  schedule:
    - cron: '0 9 * * *' # todo dia às 06h (Brasília)
  workflow_dispatch: # botão "Run workflow" na aba Actions

permissions:
  contents: write

concurrency:
  group: coletar
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # A branch gh-pages guarda os dados (e é o que o GitHub Pages publica). Pode não existir na primeira vez.
      - name: Baixar dados anteriores
        run: |
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            git clone --depth 1 --branch gh-pages "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" site
          else
            mkdir site
          fi

      - name: Coletar
        run: node coletar.js site
        env:
          PYTHON: python3

      - name: Publicar
        run: |
          cp index.html xlsx.js site/
          touch site/.nojekyll
          cd site
          rm -rf .git
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Dados de $(date -u +%F)"
          # Um único commit, sempre sobrescrito: o repositório não cresce a cada coleta
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
