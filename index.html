<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">

<link rel="icon" href="favicon.svg" type="image/svg+xml">

<meta property="og:title" content="Argos · Notícias de segurança pública">
<meta property="og:description" content="Monitor de notícias de segurança pública no estado do Rio de Janeiro: dezenas de fontes reunidas, classificadas por tipo de crime, arma e município, com análise e exportação em CSV e XLSX.">
<meta property="og:url" content="https://patrickcavalcantte.github.io/argos/">

<script>try{var t=JSON.parse(localStorage.getItem("tema"));if(!t)t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";document.documentElement.dataset.theme=t}catch(e){}</script>
<style>
  :root {
    --bg: #ffffff; --painel: #f5f6f8; --borda: #e6e8ec; --texto: #1d2733; --suave: #76808d;
    --destaque: #c0392b; --sel: #eceff3; --link: #1d2733; --ativo: #fdf0ee; --sombra: 0 8px 24px rgba(20,30,50,.14);
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #14171b; --painel: #1b1f24; --borda: #2a3037; --texto: #e6e9ed; --suave: #8a94a1;
    --sel: #262c33; --link: #e6e9ed; --ativo: #34211f; --sombra: 0 8px 24px rgba(0,0,0,.55);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--texto); height: 100vh; display: grid; grid-template-columns: 240px 400px 1fr; overflow: hidden; }
  body.analise { grid-template-columns: 240px 1fr; }
  body.analise #leitor { display: none; }
  button, select, input[type=date] { font: inherit; color: var(--texto); background: var(--bg); border: 1px solid var(--borda); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  input[type=date] { cursor: text; padding: 5px 8px; }
  button:hover { background: var(--sel); }
  button:disabled { opacity: .6; cursor: default; }

  /* Navegação */
  #nav { background: var(--painel); border-right: 1px solid var(--borda); display: flex; flex-direction: column; min-height: 0; }
  #nav .topo { padding: 16px 16px 10px; }
  #nav h1 { font-size: 20px; margin: 0 0 12px; letter-spacing: -.3px; }
  #nav h1 a { color: var(--destaque); text-decoration: none; }
  #nav h1 a:hover { opacity: .8; }
  .busca { width: 100%; padding: 8px 10px; border: 1px solid var(--borda); border-radius: 8px; background: var(--bg); color: var(--texto); font: inherit; }
  #menu { flex: 1; overflow-y: auto; padding: 4px 8px 12px; }
  .item { display: flex; justify-content: space-between; gap: 8px; padding: 7px 10px; border-radius: 8px; cursor: pointer; }
  .item:hover { background: var(--sel); }
  .item.ativo { background: var(--ativo); font-weight: 600; }
  .item .n { color: var(--suave); font-size: 12px; font-variant-numeric: tabular-nums; }
  .item.erro { color: var(--suave); text-decoration: line-through; }
  .item.grupo::before { content: '▸'; color: var(--suave); width: 14px; flex: none; transition: transform .15s; }
  .item.grupo.aberto::before { transform: rotate(90deg); }
  .item.grupo span:first-child { flex: 1; }
  .item.sub { padding-left: 30px; font-size: 13px; }
  .sep { height: 1px; background: var(--borda); margin: 8px 6px; }
  #nav .rodape { border-top: 1px solid var(--borda); padding: 10px 12px; display: flex; gap: 8px; flex-wrap: wrap; }
  #nav .rodape button { flex: 1; font-size: 13px; padding: 6px 8px; }

  /* Lista */
  #coluna { display: flex; flex-direction: column; min-width: 0; min-height: 0; border-right: 1px solid var(--borda); }
  body.analise #coluna { border-right: 0; }
  .migalha { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 4px; padding: 10px 16px 0; font-size: 12px; color: var(--suave); }
  .migalha a { color: var(--suave); text-decoration: none; cursor: pointer; }
  .migalha a:hover { color: var(--destaque); text-decoration: underline; }
  .migalha b { color: var(--texto); font-weight: 600; }
  .migalha i { font-style: normal; opacity: .6; }
  .cab { display: flex; align-items: center; gap: 10px; padding: 14px 16px 6px; }
  .cab .tit-col { flex: 1; min-width: 0; }
  .cab h2 { margin: 0; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta { color: var(--suave); font-size: 12px; }
  .abas { display: flex; flex: none; }
  .abas button { border-radius: 0; margin: 0; padding: 5px 12px; font-size: 13px; }
  .abas button:first-child { border-radius: 8px 0 0 8px; }
  .abas button:last-child { border-radius: 0 8px 8px 0; border-left: 0; }
  .abas button.on { background: var(--sel); font-weight: 600; }
  .ferr { display: flex; gap: 8px; align-items: center; padding: 8px 16px 10px; border-bottom: 1px solid var(--borda); position: relative; }
  .ferr .esp { flex: 1; }
  .ferr button { font-size: 13px; padding: 4px 10px; }
  .badge { display: inline-block; min-width: 16px; padding: 0 5px; margin-left: 4px; border-radius: 999px; background: var(--destaque); color: #fff; font-size: 11px; text-align: center; }
  .badge[hidden] { display: none; }
  .pop { position: absolute; z-index: 20; top: calc(100% + 4px); background: var(--bg); border: 1px solid var(--borda); border-radius: 12px; box-shadow: var(--sombra); padding: 12px; display: none; min-width: 230px; }
  .pop.aberto { display: block; }
  .pop label { display: block; font-size: 12px; color: var(--suave); margin: 8px 0 3px; }
  .pop label:first-child { margin-top: 0; }
  .pop select, .pop input { width: 100%; }
  .pop .duas-datas { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .pop.filtros { left: 16px; }
  .pop.exportar { right: 16px; padding: 6px; min-width: 190px; }
  .pop.exportar button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 8px 10px; }
  .pop.exportar button:hover { background: var(--sel); }
  #lista { overflow-y: auto; flex: 1; }
  .post { padding: 11px 16px 11px 30px; border-bottom: 1px solid var(--borda); cursor: pointer; position: relative; }
  .post::before { content: ''; position: absolute; left: 13px; top: 17px; width: 8px; height: 8px; border-radius: 50%; background: var(--destaque); }
  .post.lido::before { display: none; }
  .post:hover { background: var(--painel); }
  .post.sel { background: var(--ativo); }
  .post .l1 { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--suave); margin-bottom: 2px; }
  .post .l1 .fonte { font-weight: 600; max-width: 55%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .post .l1 .fav { margin-left: auto; color: #e0a800; }
  .post .tit { font-weight: 600; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .post.lido .tit { font-weight: 400; color: var(--suave); }
  .dia { padding: 8px 16px; background: var(--painel); font-size: 12px; color: var(--suave); border-bottom: 1px solid var(--borda); }
  .vazio { padding: 40px 20px; color: var(--suave); text-align: center; }
  .chip { display: inline-flex; gap: 6px; align-items: center; background: var(--sel); border-radius: 999px; padding: 3px 4px 3px 12px; font-size: 13px; }
  .chip button { border: 0; background: none; padding: 0 8px; }

  /* Leitor */
  #leitor { overflow-y: auto; min-width: 0; background: var(--bg); }
  .artigo { max-width: 680px; margin: 0 auto; padding: 32px 28px 64px; }
  .artigo .origem { color: var(--suave); font-size: 13px; }
  .artigo h1 { font-size: 26px; line-height: 1.25; margin: 8px 0 14px; letter-spacing: -.3px; }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 18px; }
  .tag { background: var(--sel); border-radius: 999px; padding: 2px 10px; font-size: 12px; }
  .tag.morte { background: var(--ativo); color: var(--destaque); font-weight: 600; }
  .artigo .resumo { font-size: 16px; line-height: 1.65; }
  .acoes-art { display: flex; gap: 8px; margin: 22px 0 6px; flex-wrap: wrap; }
  .primario { background: var(--destaque); color: #fff; text-decoration: none; padding: 8px 16px; border-radius: 8px; display: inline-block; }
  .primario:hover { filter: brightness(1.08); }
  .nota-art { color: var(--suave); font-size: 12px; }
  .relac { margin-top: 28px; border-top: 1px solid var(--borda); padding-top: 14px; }
  .relac h3 { font-size: 13px; margin: 0 0 8px; color: var(--suave); text-transform: uppercase; letter-spacing: .05em; }
  .relac a { display: block; color: var(--texto); text-decoration: none; padding: 5px 0; }
  .relac a:hover { text-decoration: underline; }
  .relac span { color: var(--suave); font-size: 12px; }
  .vazio-leitor { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--suave); gap: 6px; }
  .vazio-leitor b { font-size: 40px; color: var(--destaque); opacity: .35; }
  .so-mobile { display: none; }

  /* Análise */
  #analise { overflow-y: auto; flex: 1; padding: 20px; display: none; }
  .grade { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 16px; }
  .cartao { border: 1px solid var(--borda); border-radius: 12px; padding: 16px; background: var(--bg); }
  .cartao h3 { margin: 0 0 4px; font-size: 15px; }
  .cartao .sub { color: var(--suave); font-size: 12px; margin-bottom: 12px; }
  .barra { display: grid; grid-template-columns: 150px 1fr 44px; gap: 8px; align-items: center; padding: 3px 0; cursor: pointer; font-size: 13px; }
  .barra:hover .trilho i { opacity: .8; }
  .barra .rot { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .barra .trilho { background: var(--painel); border-radius: 4px; height: 14px; }
  .barra .trilho i { display: block; height: 100%; border-radius: 4px; background: var(--destaque); }
  .barra .val { text-align: right; color: var(--suave); font-variant-numeric: tabular-nums; }
  .cartao select { margin-bottom: 10px; }
  .aviso { color: var(--suave); font-size: 12px; margin-top: 10px; }
  .kpis { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
  .kpi { border: 1px solid var(--borda); border-radius: 12px; padding: 12px 18px; min-width: 130px; }
  .kpi b { display: block; font-size: 24px; }
  .kpi span { color: var(--suave); font-size: 12px; }

  @media (max-width: 1100px) { body { grid-template-columns: 220px 340px 1fr; } }
  @media (max-width: 860px) {
    body, body.analise { grid-template-columns: 1fr; }
    .so-mobile { display: inline-block; }
    #nav { position: fixed; z-index: 30; inset: 0 auto 0 0; width: 280px; transform: translateX(-100%); transition: transform .2s; box-shadow: var(--sombra); }
    body.menu-aberto #nav { transform: none; }
    #leitor, body.analise #leitor { position: fixed; inset: 0; z-index: 25; display: none; }
    body.lendo #leitor { display: block; }
    body.analise.lendo #leitor { display: none; }
    .pop.exportar { right: 8px; } .pop.filtros { left: 8px; }
  }
</style>
</head>
<body>
<aside id="nav">
  <div class="topo">
    <h1><a href="./" id="logo" title="Voltar para a home">Argos</a></h1>
    <input class="busca" id="busca" type="search" placeholder="Buscar nas notícias…">
  </div>
  <div id="menu"></div>
  <div class="rodape">
    <button id="tema" title="Alternar entre tema claro e escuro">Tema</button>
    <button id="atualizar">Atualizar</button>
  </div>
</aside>
<section id="coluna">
  <nav class="migalha" id="migalha" aria-label="Você está em"></nav>
  <div class="cab">
    <button id="abrirmenu" class="so-mobile" title="Menu">☰</button>
    <div class="tit-col"><h2 id="titulo">Todos os posts</h2><div class="meta" id="meta"></div></div>
    <div class="abas"><button id="aba-lista" class="on">Notícias</button><button id="aba-analise">Análise</button></div>
  </div>
  <div class="ferr">
    <button id="bfiltros">Filtros<span class="badge" id="nfiltros" hidden></span></button>
    <span class="esp"></span>
    <button id="marcar" title="Marcar como lidas as notícias da lista">Marcar como lidos</button>
    <button id="bexportar">Exportar ▾</button>
    <div class="pop filtros" id="pfiltros">
      <label for="periodo">Período</label>
      <select id="periodo">
        <option value="0">Todo o período (30 dias)</option>
        <option value="86400000">Últimas 24 h</option>
        <option value="259200000">Últimos 3 dias</option>
        <option value="604800000" selected>Últimos 7 dias</option>
        <option value="1296000000">Últimos 15 dias</option>
      </select>
      <label for="uf">Município do RJ</label>
      <select id="uf"><option value="">Todos os municípios</option></select>
      <label>Ou escolha as datas</label>
      <div class="duas-datas"><input type="date" id="de" title="De"><input type="date" id="ate" title="Até"></div>
      <label><button id="limpar" style="width:100%">Limpar filtros</button></label>
    </div>
    <div class="pop exportar" id="pexportar">
      <button id="csv" title="Baixar os dados classificados">Planilha CSV</button>
      <button id="xlsx" title="Planilha Excel com links clicáveis">Planilha Excel (XLSX)</button>
      <button id="relatorio" title="Relatório preliminar do período e município escolhidos, pronto para imprimir ou salvar em PDF">Relatório (PDF)</button>
    </div>
  </div>
  <div id="lista"></div>
  <div id="analise"></div>
</section>
<section id="leitor"></section>
<script src="xlsx.js"></script>
<script src="relatorio.js"></script>
<script>
const $ = (id) => document.getElementById(id);
// Online (GitHub Pages) os dados são atualizados por uma coleta diária; só o servidor local tem o botão Atualizar
const local = ['localhost', '127.0.0.1'].includes(location.hostname);
if (!local) $('atualizar').style.display = 'none';
let contagens = { dias: {} };
let arquivo = { meses: new Set(), carregados: new Set(), promessas: {} }; // notícias de 30 dias a 1 ano, um arquivo por mês
const guardar = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
const ler = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };

let dados = { itens: [], status: [] };
let lidos = new Set(ler('lidos', []));
let favoritos = new Set(ler('favoritos', []));
let filtro = { tipo: 'todos', valor: null };
let termo = '';
let visao = 'lista';
let extra = {}; // { cat, uf, arma } vindos dos gráficos
let ufGrafico = '';
let ufSel = ''; // filtro por município do RJ, vale para lista, análise e exportações

const norm = (s) => (s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// Notícias do período e do estado escolhidos (datas manuais substituem o seletor); é o que as exportações levam
function noPeriodo() {
  const de = $('de').value, ate = $('ate').value;
  const limite = de || ate ? 0 : +$('periodo').value;
  const agora = Date.now();
  return dados.itens.filter((i) => {
    if (limite && (!i.data || agora - new Date(i.data) > limite)) return false;
    if (de && (!i.data || i.data.slice(0, 10) < de)) return false;
    if (ate && (!i.data || i.data.slice(0, 10) > ate)) return false;
    if (ufSel && i.mun !== ufSel) return false;
    return true;
  });
}

function visiveis(semExtra) {
  const q = norm(termo);
  return noPeriodo().filter((i) => {
    if (filtro.tipo === 'grupo' && i.grupo !== filtro.valor) return false;
    if (filtro.tipo === 'fonte' && i.fonteId !== filtro.valor) return false;
    if (filtro.tipo === 'naolidos' && lidos.has(i.id)) return false;
    if (filtro.tipo === 'favoritos' && !favoritos.has(i.id)) return false;
    if (q && !norm(i.titulo + ' ' + i.resumo).includes(q)) return false;
    if (!semExtra && extra.cat && !(i.cats || []).includes(extra.cat)) return false;
    if (!semExtra && extra.arma && !(i.morte && (i.arma || 'Não informada') === extra.arma)) return false;
    return true;
  });
}

// Municípios do RJ que aparecem nos dados, com a quantidade de notícias
function montarEstados() {
  const n = {};
  for (const i of dados.itens) if (i.mun) n[i.mun] = (n[i.mun] || 0) + 1;
  const muns = Object.keys(n).sort((a, b) => a.localeCompare(b, 'pt-BR'));
  $('uf').innerHTML = '<option value="">Todos os municípios</option>' + muns.map((m) => `<option value="${esc(m)}">${esc(m)} (${n[m]})</option>`).join('');
  $('uf').value = muns.includes(ufSel) ? ufSel : (ufSel = '');
}

// Meses do arquivo que o período escolhido precisa: com datas, os meses do intervalo; em "Todo o período", todos
function mesesNecessarios() {
  const todos = [...arquivo.meses].sort();
  const de = $('de').value, ate = $('ate').value;
  if (de || ate) return todos.filter((m) => (!de || m >= de.slice(0, 7)) && (!ate || m <= ate.slice(0, 7)));
  return +$('periodo').value === 0 ? todos : [];
}
const faltaArquivo = () => mesesNecessarios().some((m) => !arquivo.carregados.has(m));

function baixarMes(m) {
  return (arquivo.promessas[m] ??= fetch(`data/arquivo/${m}.json`, { cache: 'no-cache' }).then((r) => r.json()).then((j) => {
    j.itens.forEach((i) => { i.id = i.link; i.cats = i.cats || []; i.resumo = i.resumo || ''; });
    for (const i of j.itens) dados.itens.push(i);
    arquivo.carregados.add(m);
  }).catch(() => { delete arquivo.promessas[m]; }));
}

async function garantirArquivo() {
  if (!faltaArquivo()) return;
  await Promise.all(mesesNecessarios().map(baixarMes));
  montarEstados(); lista();
}

function hora(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
}
const diaRotulo = (iso) => {
  if (!iso) return 'Sem data';
  const d = new Date(iso), h = new Date();
  const ontem = new Date(); ontem.setDate(h.getDate() - 1);
  if (d.toDateString() === h.toDateString()) return 'Hoje';
  if (d.toDateString() === ontem.toDateString()) return 'Ontem';
  return d.toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: 'long' });
};

function chips() {
  const nomes = { cat: 'Crime', uf: 'Município', arma: 'Arma' };
  return Object.entries(extra).map(([k, v]) => `<span class="chip">${nomes[k]}: ${esc(v)}<button data-limpar="${k}" title="Remover">✕</button></span>`).join(' ');
}

function barras(pares, chave, max) {
  const m = Math.max(1, ...pares.map((p) => p[1]));
  return pares.slice(0, max || 12).map(([nome, n, rot]) =>
    `<div class="barra" data-filtro="${chave}" data-valor="${esc(nome)}" title="Ver notícias"><span class="rot">${esc(rot || nome)}</span><span class="trilho"><i style="width:${(n / m) * 100}%"></i></span><span class="val">${n}</span></div>`).join('') || '<div class="aviso">Sem dados neste período.</div>';
}

// Histórico longo: as notícias ficam só 30 dias no ar, mas as contagens diárias são acumuladas (contagens.json)
let serie = ''; // '' = todos os casos, ou 'mun:Niterói' / 'cat:Roubo / furto'
function tendencia() {
  const dias = Object.entries(contagens.dias || {}).sort();
  const [tipo, ...resto] = serie.split(':'), valor = resto.join(':');
  const meses = {}, ufs = new Set(), cats = new Set();
  for (const [d, v] of dias) {
    Object.keys(v.mun || {}).forEach((u) => ufs.add(u));
    Object.keys(v.cat || {}).forEach((c) => cats.add(c));
    const m = d.slice(0, 7);
    meses[m] = (meses[m] || 0) + (serie ? (v[tipo] || {})[valor] || 0 : v.casos);
  }
  const op = (v, rot) => `<option value="${esc(v)}" ${v === serie ? 'selected' : ''}>${esc(rot)}</option>`;
  const seletor = `<select id="serie">${op('', 'Todos os casos')}<optgroup label="Município">${[...ufs].sort((a, b) => a.localeCompare(b, 'pt-BR')).map((u) => op('mun:' + u, u)).join('')}</optgroup><optgroup label="Tipo de crime">${[...cats].sort().map((c) => op('cat:' + c, c)).join('')}</optgroup></select>`;
  const mesRot = (m) => new Date(m + '-15T12:00').toLocaleDateString('pt-BR', { month: 'short', year: 'numeric' });
  const pares = Object.entries(meses).sort().reverse().map(([m, n]) => [m, n, mesRot(m)]);
  const desde = dias.length ? new Date(dias[0][0] + 'T12:00').toLocaleDateString('pt-BR') : '';
  return `<div class="cartao"><h3>Casos por mês (histórico)</h3><div class="sub">Contagem diária acumulada${desde ? ' desde ' + desde : ''}${dados.janelaDias ? `; as notícias em si ficam disponíveis por ${dados.arquivoDias === 365 ? '1 ano' : dados.janelaDias + ' dias'}` : ''}.</div>${seletor}${barras(pares, 'mes', 12)}<div class="aviso">O mês mais recente pode estar incompleto.</div></div>`;
}

function analise() {
  const todas = visiveis(true);
  const itens = todas.filter((i) => !i.dup); // conta casos distintos, não notícias repetidas
  const cats = {}, armas = {}, ufs = {}, regs = {}, dias = {};
  let semUf = 0, mortes = 0;
  for (const i of itens) {
    for (const c of i.cats || []) cats[c] = (cats[c] || 0) + 1;
    if (i.morte) { mortes++; const a = i.arma || 'Não informada'; armas[a] = (armas[a] || 0) + 1; }
    if (i.mun) {
      if (!ufGrafico || (i.cats || []).includes(ufGrafico)) { ufs[i.mun] = (ufs[i.mun] || 0) + 1; if (i.regiaoRJ) regs[i.regiaoRJ] = (regs[i.regiaoRJ] || 0) + 1; }
    } else semUf++;
    if (i.data) { const d = i.data.slice(0, 10); dias[d] = (dias[d] || 0) + 1; }
  }
  const ord = (o) => Object.entries(o).sort((a, b) => b[1] - a[1]);
  const opcoes = ['', ...Object.keys(cats)].map((c) => `<option value="${esc(c)}" ${c === ufGrafico ? 'selected' : ''}>${c || 'Todas as categorias'}</option>`).join('');
  const comArma = Object.entries(armas).filter(([a]) => a !== 'Não informada').reduce((t, [, n]) => t + n, 0);
  const diaRot = (d) => new Date(d + 'T12:00').toLocaleDateString('pt-BR', { weekday: 'short', day: '2-digit', month: '2-digit' });
  $('analise').innerHTML = `
    <div class="kpis">
      <div class="kpi"><b>${todas.length}</b><span>notícias no período</span></div>
      <div class="kpi"><b>${itens.length}</b><span>casos distintos</span></div>
      <div class="kpi"><b>${mortes}</b><span>envolvendo morte</span></div>
      <div class="kpi"><b>${comArma}</b><span>mortes com arma identificada</span></div>
      <div class="kpi"><b>${itens.length - semUf}</b><span>com município identificado</span></div>
    </div>
    <div class="grade">
      <div class="cartao"><h3>Notícias por tipo de crime</h3><div class="sub">Casos distintos (notícias repetidas do mesmo fato contam uma vez). Um caso pode ter mais de um tipo. Clique numa barra para ver as notícias.</div>${barras(ord(cats), 'cat', 14)}</div>
      <div class="cartao"><h3>Mortes por tipo de arma</h3><div class="sub">Notícias que mencionam morte, pelo meio descrito no texto.</div>${barras(ord(armas), 'arma')}<div class="aviso">"Não informada" = a manchete não diz como a vítima morreu.</div></div>
      <div class="cartao"><h3>Municípios com mais notícias</h3><div class="sub">Filtre por tipo de ocorrência:</div><select id="ufcat">${opcoes}</select>${barras(ord(ufs).map(([u, n]) => [u, n, u]), 'uf', 15)}<div class="aviso">${semUf} notícias sem município identificado ficam de fora.</div></div>
      <div class="cartao"><h3>Notícias por região do estado</h3><div class="sub">${ufGrafico ? esc(ufGrafico) : 'Todas as categorias'}</div>${barras(ord(regs), 'regiao')}</div>
      <div class="cartao"><h3>Notícias por dia</h3><div class="sub">Volume de notícias coletadas.</div>${barras(Object.entries(dias).sort().reverse().map(([d, n]) => [d, n, diaRot(d)]), 'dia', 8)}</div>
      ${tendencia()}
    </div>
    <div class="aviso">A classificação é feita por palavras-chave (script analise.py) sobre título e resumo; é uma estimativa, não estatística oficial.</div>`;
}

// ---- Navegação lateral: grupos recolhidos; as fontes aparecem ao abrir o grupo
const abertos = new Set();
function menu() {
  const naoLidos = dados.itens.filter((i) => !lidos.has(i.id)).length;
  const linha = (tipo, valor, nome, n, cls = '') =>
    `<div class="item ${cls} ${filtro.tipo === tipo && filtro.valor === valor ? 'ativo' : ''}" data-tipo="${tipo}" data-valor="${esc(valor ?? '')}"><span>${esc(nome)}</span><span class="n">${n ?? ''}</span></div>`;
  const porGrupo = {}, porFonte = {};
  for (const i of dados.itens) { porGrupo[i.grupo] = (porGrupo[i.grupo] || 0) + 1; porFonte[i.fonteId] = (porFonte[i.fonteId] || 0) + 1; }
  $('menu').innerHTML =
    linha('todos', null, 'Todos os posts', dados.itens.length) +
    linha('naolidos', null, 'Não lidos', naoLidos) +
    linha('favoritos', null, '★ Favoritados', favoritos.size) +
    '<div class="sep"></div>' +
    [...new Set(dados.status.map((s) => s.grupo))].map((g) =>
      `<div class="item grupo ${abertos.has(g) ? 'aberto' : ''} ${filtro.tipo === 'grupo' && filtro.valor === g ? 'ativo' : ''}" data-tipo="grupo" data-valor="${esc(g)}"><span>${esc(g)}</span><span class="n">${porGrupo[g] || 0}</span></div>` +
      (abertos.has(g) ? dados.status.filter((s) => s.grupo === g).map((s) => linha('fonte', s.id, s.nome, s.ok ? porFonte[s.id] || 0 : '✕', 'sub ' + (s.ok ? '' : 'erro'))).join('') : '')
    ).join('');
}

const relativo = (iso) => {
  if (!iso) return '';
  const min = Math.round((Date.now() - new Date(iso)) / 60000);
  if (min < 1) return 'agora';
  if (min < 60) return `${min} min`;
  if (min < 1440) return `${Math.round(min / 60)} h`;
  return new Date(iso).toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' });
};

// A lista esconde as repetições do mesmo caso (aparecem no leitor, em "Mesmo caso em outros veículos"); as exportações levam tudo
const paraLista = () => visiveis().filter((i) => !i.dup);

function lista() {
  document.body.classList.toggle('analise', visao === 'analise');
  $('lista').style.display = visao === 'lista' ? '' : 'none';
  $('analise').style.display = visao === 'analise' ? 'block' : 'none';

  $('marcar').style.display = visao === 'lista' ? '' : 'none';
  badgeFiltros(); migalha();
  if (visao === 'analise') { analise(); menu(); return meta(); }
  const itens = paraLista();
  let html = '';
  const LIMITE = 500;
  for (const i of itens.slice(0, LIMITE)) {
    html += `<div class="post ${lidos.has(i.id) ? 'lido' : ''} ${sel === i.id ? 'sel' : ''}" data-id="${esc(i.id)}">
      <div class="l1"><span class="fonte">${esc(i.fonte)}</span><span>· ${relativo(i.data)}${i.mun ? ' · ' + esc(i.mun) : ''}</span>${favoritos.has(i.id) ? '<span class="fav">★</span>' : ''}</div>
      <div class="tit">${esc(i.titulo)}</div>
    </div>`;
  }
  if (itens.length > LIMITE) html += `<div class="vazio">Mostrando as ${LIMITE} mais recentes de ${itens.length}. Use a busca ou os filtros para refinar, ou exporte a planilha com tudo.</div>`;
  html = (Object.keys(extra).length ? `<div class="dia">Filtros: ${chips()}</div>` : '') + html;
  const inicio = dados.itens.reduce((m, i) => (i.data && i.data < m ? i.data : m), '9');
  const antigo = $('ate').value && inicio.slice(0, 10) > $('ate').value; // período anterior ao que ainda está no ar
  const dias = dados.arquivoDias || dados.janelaDias || 30;
  const vazio = faltaArquivo() ? 'Carregando o arquivo de notícias…'
    : antigo ? `As notícias desse período já saíram do ar: ficam disponíveis por ${dias === 365 ? '1 ano' : dias + ' dias'}. A contagem de casos continua no histórico mensal da aba Análise.`
    : 'Nenhuma notícia encontrada com esses filtros.';
  $('lista').innerHTML = html || `<div class="vazio">${vazio}</div>`;
  const nomes = { todos: 'Todos os posts', naolidos: 'Não lidos', favoritos: 'Favoritados' };
  $('titulo').textContent = filtro.tipo === 'grupo' ? filtro.valor : filtro.tipo === 'fonte' ? (dados.status.find((s) => s.id === filtro.valor)?.nome ?? '') : nomes[filtro.tipo];
  meta(itens.length);
  menu();
  if (sel && !itens.some((i) => i.id === sel)) renderLeitor(); // mantém o artigo aberto mesmo fora da lista
}

// ---- Migalha de pão (Home › Notícias › …) e volta à home
function migalha() {
  const partes = [['Home', 'home']];
  if (visao === 'analise') partes.push(['Notícias', 'noticias'], ['Análise']);
  else {
    const g = filtro.tipo === 'grupo' ? filtro.valor : filtro.tipo === 'fonte' ? dados.status.find((x) => x.id === filtro.valor)?.grupo : null;
    const f = filtro.tipo === 'fonte' ? dados.status.find((x) => x.id === filtro.valor)?.nome : null;
    const nomes = { naolidos: 'Não lidos', favoritos: 'Favoritados' };
    partes.push(['Notícias', g || nomes[filtro.tipo] ? 'noticias' : null]);
    if (nomes[filtro.tipo]) partes.push([nomes[filtro.tipo]]);
    if (g) partes.push([g, f ? 'grupo' : null]);
    if (f) partes.push([f]);
  }
  $('migalha').innerHTML = partes.map(([nome, acao], k) => (k === partes.length - 1 || !acao ? `<b>${esc(nome)}</b>` : `<a data-ir="${acao}">${esc(nome)}</a>`)).join(' <i>›</i> '); // o último item é onde você está
}
function irHome() {
  filtro = { tipo: 'todos', valor: null }; termo = ''; $('busca').value = ''; extra = {}; ufSel = ''; ufGrafico = '';
  $('periodo').value = '604800000'; $('de').value = ''; $('ate').value = '';
  visao = 'lista'; sel = null; abertos.clear();
  document.body.classList.remove('lendo', 'menu-aberto');

}
$('logo').onclick = (e) => { e.preventDefault(); irHome(); };
$('migalha').onclick = (e) => {
  const a = e.target.closest('[data-ir]'); if (!a) return;
  if (a.dataset.ir === 'home') return irHome();
  visao = 'lista';
  if (a.dataset.ir === 'noticias') filtro = { tipo: 'todos', valor: null };
  if (a.dataset.ir === 'grupo') filtro = { tipo: 'grupo', valor: dados.status.find((x) => x.id === filtro.valor)?.grupo };

};

// ---- Leitor
let sel = null;
function renderLeitor() {
  const i = sel && dados.itens.find((x) => x.id === sel);
  if (!i) { $('leitor').innerHTML = '<div class="vazio-leitor"><b>A</b><span>Selecione uma notícia para ler</span></div>'; return; }
  const dataTxt = i.data ? new Date(i.data).toLocaleString('pt-BR', { dateStyle: 'long', timeStyle: 'short' }) : '';
  const tags = [...(i.cats || []).map((c) => `<span class="tag">${esc(c)}</span>`), i.morte ? `<span class="tag morte">Morte${i.arma ? ' · ' + esc(i.arma) : ''}</span>` : '',
    i.mun ? `<span class="tag">${esc(i.mun)}</span>` : '', i.regiaoRJ ? `<span class="tag">${esc(i.regiaoRJ)}</span>` : ''].join('');
  const relac = i.caso ? dados.itens.filter((x) => x.caso === i.caso && x.id !== i.id).sort((a, b) => (b.data || '').localeCompare(a.data || '')).slice(0, 8) : [];
  $('leitor').innerHTML = `<article class="artigo">
    <button id="voltar" class="so-mobile">‹ Voltar</button>
    <div class="origem">${esc(i.fonte)} · ${esc(dataTxt)}</div>
    <h1>${esc(i.titulo)}</h1>

    <div class="acoes-art">
      <a class="primario" href="${esc(i.link)}" target="_blank" rel="noopener">Abrir matéria original ↗</a>
      <button data-fav="${esc(i.id)}">${favoritos.has(i.id) ? '★ Favoritada' : '☆ Favoritar'}</button>
      <button data-naolido="${esc(i.id)}">Marcar como não lida</button>
    </div>
    <div class="nota-art">O Argos mostra só título e resumo; a matéria completa está no site do veículo.</div>
    ${relac.length ? `<div class="relac"><h3>Mesmo caso em outros veículos</h3>${relac.map((x) => `<a href="${esc(x.link)}" target="_blank" rel="noopener">${esc(x.titulo)}<br><span>${esc(x.fonte)} · ${relativo(x.data)}</span></a>`).join('')}</div>` : ''}
  </article>`;
  $('leitor').scrollTop = 0;

function selecionar(id) {
  sel = id;
  lidos.add(id); guardar('lidos', [...lidos]);
  document.querySelectorAll('#lista .post').forEach((p) => { p.classList.toggle('sel', p.dataset.id === id); if (p.dataset.id === id) p.classList.add('lido'); });
  document.body.classList.add('lendo');
  renderLeitor(); menu();
}

function mover(passo) {
  const itens = paraLista().slice(0, 500);
  if (!itens.length) return;
  const k = itens.findIndex((i) => i.id === sel);
  const prox = itens[Math.min(itens.length - 1, Math.max(0, k + passo))];
  selecionar(prox.id);
  document.querySelector('#lista .post.sel')?.scrollIntoView({ block: 'nearest' });
}

function badgeFiltros() {
  const n = (+$('periodo').value !== 604800000 && !$('de').value && !$('ate').value ? 1 : 0) + (ufSel ? 1 : 0) + ($('de').value || $('ate').value ? 1 : 0);
  $('nfiltros').hidden = !n; $('nfiltros').textContent = n;
}

function meta(n) {
  const quando = dados.atualizadoEm ? new Date(dados.atualizadoEm).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : '–';
  $('meta').textContent = `${n ?? visiveis(true).length} notícias · atualizado em ${quando}`;
}

async function carregar(forcar) {
  $('atualizar').disabled = true; $('atualizar').textContent = 'Atualizando…';
  try {
    if (forcar) await fetch('api/atualizar');
    dados = await (await fetch('data/noticias.json', { cache: 'no-cache' })).json();
    dados.itens.forEach((i) => { i.id = i.link; i.cats = i.cats || []; i.resumo = i.resumo || ''; }); // o link é o identificador
    arquivo = { meses: new Set(dados.arquivo || []), carregados: new Set(), promessas: {} };
    $('periodo').options[0].textContent = dados.arquivoDias ? 'Todo o período (1 ano)' : 'Todo o período';
    montarEstados();
  } catch { $('meta').textContent = 'Dados indisponíveis'; }
  try { contagens = await (await fetch('data/contagens.json', { cache: 'no-cache' })).json(); } catch {}
  $('atualizar').disabled = false; $('atualizar').textContent = 'Atualizar';
  lista();
  garantirArquivo();
}

$('menu').onclick = (e) => {
  const el = e.target.closest('.item'); if (!el) return;
  filtro = { tipo: el.dataset.tipo, valor: el.dataset.valor || null };
  if (filtro.tipo === 'grupo') abertos.has(filtro.valor) ? abertos.delete(filtro.valor) : abertos.add(filtro.valor);
  document.body.classList.remove('menu-aberto');

};
$('aba-lista').onclick = () => { visao = 'lista'; lista(); };
$('aba-analise').onclick = () => { visao = 'analise'; lista(); };
$('analise').onclick = (e) => {
  const b = e.target.closest('[data-filtro]');
  if (!b) return;
  const { filtro: k, valor } = b.dataset;
  if (k === 'mes') { // barra do histórico mensal: mostra as notícias do mês, na série escolhida no card
    const [ano, mes] = valor.split('-'), ultimo = new Date(+ano, +mes, 0).getDate();
    $('de').value = `${valor}-01`; $('ate').value = `${valor}-${String(ultimo).padStart(2, '0')}`;
    const [tipo, ...resto] = serie.split(':'), v = resto.join(':');

    if (tipo === 'mun' && [...$('uf').options].some((o) => o.value === v)) { ufSel = v; $('uf').value = v; }
    visao = 'lista'; lista(); return;
  }
  if (k === 'uf') { ufSel = valor; $('uf').value = valor; extra = {}; visao = 'lista'; lista(); }
  else if (['cat', 'arma'].includes(k)) { extra = { [k]: valor }; visao = 'lista'; lista(); }
};
$('analise').onchange = (e) => {
  if (e.target.id === 'ufcat') { ufGrafico = e.target.value; analise(); }
  if (e.target.id === 'serie') { serie = e.target.value; analise(); }
};
$('lista').addEventListener('click', (e) => {
  const l = e.target.closest('[data-limpar]');
  if (l) { delete extra[l.dataset.limpar]; lista(); }
});
$('busca').oninput = (e) => { termo = e.target.value; lista(); };
$('periodo').onchange = () => { $('de').value = ''; $('ate').value = ''; lista(); garantirArquivo(); };
$('de').onchange = $('ate').onchange = () => { lista(); garantirArquivo(); };
$('uf').onchange = () => { ufSel = $('uf').value; lista(); };

// Exportações geradas no navegador, com o período escolhido na tela
const CAMPOS = ['data', 'fonte', 'grupo', 'titulo', 'resumo', 'link', 'mun', 'regiaoRJ', 'categorias', 'arma', 'morte', 'duplicata', 'caso', 'coletadoEm'];
const campo = (i, c) => c === 'categorias' ? (i.cats || []).join('; ') : c === 'duplicata' ? (i.dup ? 'sim' : 'nao') : c === 'morte' ? (i.morte ? 'sim' : 'nao') : (i[c] ?? '');
const nomeCampo = (c) => ({ coletadoEm: 'coletado_em', mun: 'municipio', regiaoRJ: 'regiao_rj' }[c] || c);
function baixar(blob, ext) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `argos-${new Date().toISOString().slice(0, 10)}.${ext}`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
}
$('csv').onclick = async () => {

  baixar(new Blob(['﻿' + [CAMPOS.map(nomeCampo).join(','), ...linhas].join('\r\n')], { type: 'text/csv;charset=utf-8' }), 'csv'); // BOM: o Excel reconhece UTF-8
};

};

const aplicarTema = (t) => { document.documentElement.dataset.theme = t; $('tema').textContent = t === 'dark' ? '☀ Tema claro' : '☾ Tema escuro'; };
aplicarTema(document.documentElement.dataset.theme || 'light');
$('tema').onclick = () => { const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; aplicarTema(t); guardar('tema', t); };
renderLeitor();

carregar(false);
if (local) setInterval(() => carregar(false), 10 * 60 * 1000);
</script>
</body>
</html>
